<script>
const SUPABASE_URL = 'https://afsqlxxkllewgumadjkn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HtgRECbeXHIcnUf5B6JyDA_21UdXF3U';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// GANTI password ini jadi password rahasia kamu sendiri sebagai admin toko
const ADMIN_KEY = 'anjing' ;

function getDeviceId(){
  let id = localStorage.getItem('llowye_device_id');
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('llowye_device_id', id);
  }
  return id;
}

function isAdmin(){
  return localStorage.getItem('llowye_is_admin') === 'true';
}

function adminLogin(){
  const pw = prompt('Masukkan password admin:');
  if(pw === null) return;
  if(pw === ADMIN_KEY){
    localStorage.setItem('llowye_is_admin', 'true');
    alert('Mode admin aktif.');
  }else{
    alert('Password salah.');
  }
  if(unlocked) muatAdmin();
}

function adminLogout(){
  localStorage.removeItem('llowye_is_admin');
  alert('Mode admin dimatikan.');
  if(unlocked) muatAdmin();
}

let selectedRating = 0;
document.querySelectorAll('#stars span').forEach(star => {
  star.addEventListener('click', () => {
    selectedRating = parseInt(star.dataset.v);
    document.querySelectorAll('#stars span').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.v) <= selectedRating);
    });
  });
});

function playClickSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  [700, 1100].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);
    gain.gain.setValueAtTime(0.9, ctx.currentTime + i * 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + i * 0.05);
    osc.stop(ctx.currentTime + i * 0.05 + 0.1);
  });
}

async function kirim(){
  const nama = document.getElementById('nama').value.trim() || 'Anonim';
  const pesan = document.getElementById('pesan').value.trim();
  const err = document.getElementById('err');

  if(pesan === ''){
    err.classList.add('show');
    return;
  }
  err.classList.remove('show');

  try{
    const { error } = await supabaseClient
      .from('saran')
      .insert([{ nama, rating: selectedRating, pesan, device_id: getDeviceId() }]);

    if(error){
      alert('Gagal menyimpan, coba lagi ya.');
      return;
    }
    playClickSound();
    document.getElementById('formBody').classList.add('hide');
    document.getElementById('success').classList.add('show');
    const gif = document.getElementById('successGif');
    setTimeout(() => { gif.classList.add('pop'); }, 120);

    const terkirimText = document.getElementById('terkirimText');
    const makasihText = document.getElementById('makasihText');
    setTimeout(() => { terkirimText.classList.add('fadeOut'); }, 1400);
    setTimeout(() => { makasihText.classList.add('show'); }, 1750);
    setTimeout(() => { makasihText.classList.add('fadeOut'); }, 3250);
    if(unlocked) await muatAdmin();
  }catch(e){
    alert('Gagal menyimpan, coba lagi ya.');
  }
}

let unlocked = false;

async function togglePanel(){
  const admin = document.getElementById('admin');

  if(unlocked){
    unlocked = false;
    admin.classList.remove('show');
    admin.innerHTML = '';
    return;
  }

  unlocked = true;
  await muatAdmin();
}

async function muatAdmin(){
  const admin = document.getElementById('admin');
  admin.classList.add('show');
  admin.innerHTML = '<div class="admin-empty">memuat...</div>';

  try{
    const { data, error } = await supabaseClient
      .from('saran')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      admin.innerHTML = '<div class="admin-empty">gagal memuat masukan</div>';
      return;
    }

    const adminBar = '<div class="adminBar">' +
      (isAdmin()
        ? '<span class="adminStatus">Mode admin aktif</span><button class="balasKecil" onclick="adminLogout()">Keluar admin</button>'
        : '<button class="balasKecil" onclick="adminLogin()">Masuk sebagai admin</button>') +
      '</div>';

    if(!data || data.length === 0){
      admin.innerHTML = adminBar + '<div class="admin-empty">belum ada masukan yang masuk</div>';
      return;
    }

    const { data: semuaBalasan } = await supabaseClient
      .from('balasan_saran')
      .select('*')
      .order('created_at', { ascending: true });

    const balasanList = semuaBalasan || [];
    const myId = getDeviceId();

    admin.innerHTML = adminBar + data.map(en => {
      const bintang = en.rating > 0 ? '★'.repeat(en.rating) + '☆'.repeat(5 - en.rating) : 'belum kasih rating';
      const tgl = new Date(en.created_at).toLocaleString('id-ID', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
      const untukIni = balasanList.filter(b => b.saran_id === en.id);
      const isMine = en.device_id && en.device_id === myId;
      const ownerBtns = (isMine || isAdmin())
        ? '<div class="ownerBtns">' +
            '<button class="kecilBtn" onclick="editSaranMode(\'' + en.id + '\')">Edit</button>' +
            '<button class="kecilBtn hapus" onclick="hapusSaran(\'' + en.id + '\')">Hapus</button>' +
          '</div>'
        : '';
      return '<div class="admin-item">' +
        '<div class="top"><span class="nama">' + escapeHtml(en.nama) + '</span><span class="waktu">' + tgl + '</span></div>' +
        '<div class="bintang">' + bintang + '</div>' +
        '<div class="pesan" id="feedPesan-' + en.id + '">' + escapeHtml(en.pesan) + '</div>' +
        ownerBtns +
        renderThread(en.id, untukIni) +
      '</div>';
    }).join('');
  }catch(e){
    admin.innerHTML = '<div class="admin-empty">gagal memuat masukan</div>';
  }
}

function editSaranMode(id){
  const el = document.getElementById('feedPesan-' + id);
  const original = el.textContent;
  el.innerHTML = '<textarea id="editSaran-' + id + '">' + escapeHtml(original) + '</textarea>' +
    '<div class="ownerBtns">' +
    '<button class="kecilBtn" onclick="simpanEditSaran(\'' + id + '\')">Simpan</button>' +
    "<button class='kecilBtn hapus' onclick='batalEditSaran(" + JSON.stringify(id) + ", " + JSON.stringify(original).replace(/'/g, "&#39;") + ")'>Batal</button>" +
    '</div>';
}

function batalEditSaran(id, original){
  document.getElementById('feedPesan-' + id).textContent = original;
}

async function simpanEditSaran(id){
  const textarea = document.getElementById('editSaran-' + id);
  const pesanBaru = textarea.value.trim();
  if(pesanBaru === ''){
    return;
  }
  try{
    let query = supabaseClient.from('saran').update({ pesan: pesanBaru }).eq('id', id);
    if(!isAdmin()){
      query = query.eq('device_id', getDeviceId());
    }
    const { error } = await query;

    if(error){
      alert('Gagal simpan perubahan, coba lagi ya.');
      return;
    }
    await muatAdmin();
  }catch(e){
    alert('Gagal simpan perubahan, coba lagi ya.');
  }
}

async function hapusSaran(id){
  if(!confirm('Yakin mau hapus komentar ini?')){
    return;
  }
  try{
    let query = supabaseClient.from('saran').delete().eq('id', id);
    if(!isAdmin()){
      query = query.eq('device_id', getDeviceId());
    }
    const { error } = await query;

    if(error){
      alert('Gagal hapus, coba lagi ya.');
      return;
    }
    await muatAdmin();
  }catch(e){
    alert('Gagal hapus, coba lagi ya.');
  }
}

function renderThread(saranId, balasanList){
  const myId = getDeviceId();
  const itemsHtml = balasanList.map(b => {
    const target = b.reply_to ? balasanList.find(x => x.id === b.reply_to) : null;
    const badge = target ? '<div class="replyBadge">Membalas @' + escapeHtml(target.nama) + '</div>' : '';
    const isMine = b.device_id && b.device_id === myId;
    const ownerBtns = (isMine || isAdmin())
      ? '<button class="balasKecil" onclick="editBalasanMode(\'' + b.id + '\')">Edit</button>' +
        '<button class="balasKecil" onclick="hapusBalasan(\'' + b.id + '\')">Hapus</button>'
      : '';
    return '<div class="thread-item">' + badge +
      '<div class="thread-nama">' + escapeHtml(b.nama) + '</div>' +
      '<div class="thread-isi" id="isiBalasan-' + b.id + '">' + escapeHtml(b.isi) + '</div>' +
      "<button class='balasKecil' onclick='tampilFormBalas(" + JSON.stringify(saranId) + ", " + JSON.stringify(b.id) + ", " + JSON.stringify(b.nama).replace(/'/g, "&#39;") + ")'>Balas</button>" +
      ownerBtns +
      '<div class="formBalasSlot" id="formBalas-' + b.id + '"></div>' +
    '</div>';
  }).join('');

  return '<div class="balasan">' + itemsHtml +
  '</div>';
}
  
function tampilFormBalas(saranId, replyTo, namaDibales){
  const slotId = replyTo ? 'formBalas-' + replyTo : 'formBalas-root-' + saranId;
  const slot = document.getElementById(slotId);
  const label = namaDibales ? 'Membalas @' + namaDibales : 'Tambah balasan';
  slot.innerHTML =
    '<div class="label">' + label + '</div>' +
    '<input type="text" id="namaBalas-' + slotId + '" placeholder="Nama kamu">' +
    '<textarea id="isiBalas-' + slotId + '" placeholder="Tulis balasan..."></textarea>' +
    '<button class="kirimBalasan" onclick="kirimBalasan(\'' + saranId + '\', ' + (replyTo ? "'" + replyTo + "'" : 'null') + ', \'' + slotId + '\')">Kirim</button>';
}

async function kirimBalasan(saranId, replyTo, slotId){
  const nama = document.getElementById('namaBalas-' + slotId).value.trim() || 'Anonim';
  const isi = document.getElementById('isiBalas-' + slotId).value.trim();
  if(isi === ''){
    return;
  }
  try{
    const { error } = await supabaseClient
      .from('balasan_saran')
      .insert([{ saran_id: saranId, nama, isi, reply_to: replyTo, device_id: getDeviceId() }]);

    if(error){
      alert('Gagal kirim balasan, coba lagi ya.');
      return;
    }
    await muatAdmin();
  }catch(e){
    alert('Gagal kirim balasan, coba lagi ya.');
  }
}
function editBalasanMode(id){
  const el = document.getElementById('isiBalasan-' + id);
  const original = el.textContent;
  el.innerHTML = '<textarea id="editBalasan-' + id + '">' + escapeHtml(original) + '</textarea>' +
    '<button class="kirimBalasan" onclick="simpanEditBalasan(\'' + id + '\')">Simpan</button>' +
    "<button class='kirimBalasan' style='background:transparent;border:1px solid #4FAE55;color:#1B3A17;' onclick='batalEditBalasan(" + JSON.stringify(id) + ", " + JSON.stringify(original).replace(/'/g, "&#39;") + ")'>Batal</button>";
}

function batalEditBalasan(id, original){
  document.getElementById('isiBalasan-' + id).textContent = original;
}

async function simpanEditBalasan(id){
  const textarea = document.getElementById('editBalasan-' + id);
  const isiBaru = textarea.value.trim();
  if(isiBaru === ''){
    return;
  }
  try{
    let query = supabaseClient.from('balasan_saran').update({ isi: isiBaru }).eq('id', id);
    if(!isAdmin()){
      query = query.eq('device_id', getDeviceId());
    }
    const { error } = await query;

    if(error){
      alert('Gagal simpan perubahan, coba lagi ya.');
      return;
    }
    await muatAdmin();
  }catch(e){
    alert('Gagal simpan perubahan, coba lagi ya.');
  }
}

async function hapusBalasan(id){
  if(!confirm('Yakin mau hapus balasan ini?')){
    return;
  }
  try{
    let query = supabaseClient.from('balasan_saran').delete().eq('id', id);
    if(!isAdmin()){
      query = query.eq('device_id', getDeviceId());
    }
    const { error } = await query;

    if(error){
      alert('Gagal hapus balasan, coba lagi ya.');
      return;
    }
    await muatAdmin();
  }catch(e){
    alert('Gagal hapus balasan, coba lagi ya.');
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
